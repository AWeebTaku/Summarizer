name: Release
# Pushing a tag like v2.0.1 builds and tests every installer, then publishes to PyPI and creates the GitHub release.
# To rebuild only the installers for an existing tag (no PyPI), run this workflow by hand and enter the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach installers to (for example v2.0.1). Does not publish to PyPI.'
        required: true

permissions:
  contents: read

jobs:
  installers:
    uses: ./.github/workflows/installers.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  # PyPI never lets a version number be reused, so it only runs once every installer has built and passed.
  pypi:
    needs: installers
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install build twine pytest && pip install -e ".[desktop,dev]" && pytest -q
    - run: python -m build
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload --skip-existing dist/*

  release:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that can write to the repository
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}
    - uses: actions/download-artifact@v4
      with:
        pattern: installers-*
        path: assets
        merge-multiple: true
    - name: Checksums
      run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        files: assets/*
        body_path: .github/release-body.md
        generate_release_notes: true
