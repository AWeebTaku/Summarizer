name: Release
# Pushing a tag like v2.0.0 publishes to PyPI and attaches desktop builds to a GitHub release.
# To (re)build only the desktop apps for an existing tag without touching PyPI, run this workflow
# by hand from the Actions tab and enter the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build desktop apps for (for example v2.0.0). Does not publish to PyPI.'
        required: true

permissions:
  contents: read

jobs:
  pypi:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install build twine pytest && pip install -e ".[desktop,dev]" && pytest -q
    - run: python -m build
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload --skip-existing dist/*

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Linux GUI libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev libcairo2-dev pkg-config
    - run: pip install -e ".[build]"
    - name: Build
      shell: bash
      run: |
        pyinstaller --noconfirm --name Summarizer --windowed --onedir \
          --collect-all fastembed --collect-all onnxruntime --collect-all pysbd \
          --collect-all trafilatura --collect-all justext --collect-all courlan --collect-all htmldate \
          --add-data "text_summarizer/static${PATHSEP:-:}text_summarizer/static" \
          text_summarizer/desktop.py
      env:
        PATHSEP: ${{ runner.os == 'Windows' && ';' || ':' }}
    - name: Archive (tar keeps the executable bit on macOS and Linux)
      if: runner.os != 'Windows'
      run: tar -czf Summarizer-${{ runner.os }}.tar.gz -C dist .
    - name: Archive
      if: runner.os == 'Windows'
      run: Compress-Archive -Path dist\* -DestinationPath Summarizer-${{ runner.os }}.zip
    - uses: actions/upload-artifact@v4
      with:
        name: Summarizer-${{ runner.os }}
        path: Summarizer-${{ runner.os }}.*
        if-no-files-found: error

  # One job creates the release, so the three builds don't race each other. It is the only job that can write.
  release:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: assets
        merge-multiple: true
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        files: assets/*
        generate_release_notes: true
