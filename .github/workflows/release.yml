name: Release
# Pushing a tag like v2.0.0 builds and tests every installer, then creates the GitHub release with the downloads.
# To rebuild the installers for an existing tag, run this workflow by hand and enter the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach installers to (for example v2.0.0)'
        required: true

permissions:
  contents: read

jobs:
  installers:
    uses: ./.github/workflows/installers.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  release:
    needs: installers   # nothing is published unless every installer built and passed its tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that can write to the repository
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}
    - uses: actions/download-artifact@v4
      with:
        pattern: installers-*
        path: assets
        merge-multiple: true
    - name: Checksums
      run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        files: assets/*
        body_path: .github/release-body.md
        generate_release_notes: true
