# Builds the .deb, .rpm and Arch package from dist/Summarizer. See packaging/linux/build.sh.
name: summarizer
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Aditya Chaurasiya <adityachaurasiya57527@gmail.com>
description: |
  Summarize documents, PDFs, web pages and text, offline.
  Picks the key sentences from your text and never invents facts.
vendor: Summarizer
homepage: https://github.com/AWeebTaku/Summarizer
license: MIT

contents:
  - src: dist/Summarizer
    dst: /opt/summarizer
    type: tree
  - src: /opt/summarizer/Summarizer
    dst: /usr/bin/summarizer-app
    type: symlink
  - src: packaging/linux/summarizer.desktop
    dst: /usr/share/applications/summarizer.desktop
  - src: packaging/icons/16.png
    dst: /usr/share/icons/hicolor/16x16/apps/summarizer.png
  - src: packaging/icons/32.png
    dst: /usr/share/icons/hicolor/32x32/apps/summarizer.png
  - src: packaging/icons/48.png
    dst: /usr/share/icons/hicolor/48x48/apps/summarizer.png
  - src: packaging/icons/64.png
    dst: /usr/share/icons/hicolor/64x64/apps/summarizer.png
  - src: packaging/icons/128.png
    dst: /usr/share/icons/hicolor/128x128/apps/summarizer.png
  - src: packaging/icons/256.png
    dst: /usr/share/icons/hicolor/256x256/apps/summarizer.png
  - src: packaging/icons/512.png
    dst: /usr/share/icons/hicolor/512x512/apps/summarizer.png
  - src: LICENSE
    dst: /usr/share/doc/summarizer/LICENSE

scripts:
  postinstall: packaging/linux/postinstall.sh
  postremove: packaging/linux/postremove.sh

# Everything else (Qt, NSS, X11 helper libraries, ...) is inside the bundle. Only the graphics and
# display libraries are left to the system, because they have to match the machine's drivers.
# (libgbm and libwayland-server are removed from the bundle in build.sh for the same reason.)
overrides:
  deb:
    depends: [libgl1, libegl1, libgbm1, libpulse0, libxcb1, libdrm2, libwayland-client0, libwayland-cursor0, libwayland-egl1, libwayland-server0, libxcb-dri3-0]
  rpm:
    depends:
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libgbm.so.1()(64bit)
      - libpulse.so.0()(64bit)
      - libxcb.so.1()(64bit)
      - libdrm.so.2()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libwayland-server.so.0()(64bit)
      - libxcb-dri3.so.0()(64bit)
  archlinux:
    depends: [libglvnd, mesa, libpulse, libxcb, libdrm, wayland]

# zstd: fast to build and read by every distribution this targets (Ubuntu 22.04+, Debian 12+, Fedora, openSUSE 15.4+)
deb:
  compression: zstd
rpm:
  compression: zstd
