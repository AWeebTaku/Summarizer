[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-summarizer-aweebtaku"
dynamic = ["version"]
description = "Fast, offline extractive summarizer for text, PDFs, Word files, web pages and CSVs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Chaurasiya", email = "adityachaurasiya57527@gmail.com" }]
requires-python = ">=3.10"
keywords = ["summarization", "summarizer", "nlp", "textrank", "embeddings", "pdf", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "fastembed>=0.4",
    "pysbd>=0.3.4",
    "trafilatura>=1.12",
    "pypdf>=4",
    "python-docx>=1",
]

[project.urls]
Homepage = "https://github.com/AWeebTaku/Summarizer"
Issues = "https://github.com/AWeebTaku/Summarizer/issues"
Changelog = "https://github.com/AWeebTaku/Summarizer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
desktop = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "pywebview>=5"]
qt = ["pywebview[qt]>=5"]
build = ["text-summarizer-aweebtaku[desktop]", "pywebview[qt]>=5; sys_platform == 'linux'", "pyinstaller>=6"]
ai = ["anthropic>=0.40"]
dev = ["pytest", "httpx"]

[project.scripts]
summarize = "text_summarizer.cli:main"
summarizer-desktop = "text_summarizer.desktop:main"
text-summarizer-aweebtaku = "text_summarizer.cli:main"

[tool.setuptools]
packages = ["text_summarizer"]

[tool.setuptools.package-data]
text_summarizer = ["py.typed", "static/*", "static/fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "text_summarizer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
